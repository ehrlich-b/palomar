name: Palomar preflight

on:
  push:
  workflow_dispatch:

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: a1preflight1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"antihydra","comparator_config_path":"antihydra/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
