version: v0.4

project:
  name: "Antihydra has no semilinear inductive safety invariant"
  authors:
    - "Bryan Ehrlich"
  responsible_maintainers:
    - "Bryan Ehrlich"
  license: "Apache-2.0"
  description: >-
    In the shifted Antihydra recurrence on natural-number pairs, each successful
    round sends x to floor(3x/2). Even x earns two units of credit. Odd x spends
    one unit and halts at zero credit. From (8, 0), no semilinear set containing
    the seed admits a successful successor within the set for every member.
    The proof also gives a quantitative horizontal-ray bound and the
    Presburger-definable corollary. The seed's halting behavior is open in this
    work, and priority is unclaimed.

classification:
  arxiv: [cs.LO]
  msc2020: ["03D10"]

automation:
  methods:
    - method: agent
      tool_setup: >-
        The research assignment credits the Astra reasoning tool for the argument.
        OpenAI Codex with GPT-6.2 Sol assisted with the antecedent Lean proof.
        Codex prepared this package and offline prescreen under Bryan Ehrlich's direction.

review:
  status: agent-reviewed
  reviewers:
    - "OpenAI GPT-6.1 Terra via Codex (antecedent proof)"
    - "OpenAI Codex (package and offline prescreen)"
  notes: >-
    The antecedent received a separate agent review. The package uses kernel
    elaboration and an axiom audit. Independent human peer review remains
    outstanding.

